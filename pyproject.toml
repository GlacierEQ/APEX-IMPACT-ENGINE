[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "apex-impact-engine"
version = "0.2.0"
description = "Source-backed mission phase evaluation and impact-oriented action selection engine."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
apex-impact = "apex_impact.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
