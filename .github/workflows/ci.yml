name: CI

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Engine contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Behavioral tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: USE phase contract
        run: |
          PYTHONPATH=src python -m apex_impact.cli examples/mission.json > /tmp/decision.json
          grep '"phase": "USE"' /tmp/decision.json
          grep '"selected_action": "use-fileboss"' /tmp/decision.json
